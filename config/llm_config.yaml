# LLM Configuration for R-Zero Framework
# This file defines different model providers for evaluation and generation

evaluation_models:
  # Primary evaluation model (used for checking answers)
  primary:
    provider: "ollama"  # Options: "openai", "docker", "ollama" 
    config:
      base_url: "http://localhost:11434"
      model_name: "deepseek-r1:1.5b"
  
  # Fallback evaluation models (tried if primary fails)
  fallback:
    - provider: "docker"
      config:
        base_url: "http://localhost:12434/engines/llama.cpp/v1"
        model_name: "llama3.2"
    - provider: "openai"
      config:
        base_url: "https://api.openai.com/v1"
        model_name: "gpt-4o"
        api_key: "${OPENAI_API_KEY}"  # Will be replaced by environment variable

# Generation models (for question generation and solving)
generation_models:
  # Challenger model - can be powerful external models like GPT or Claude
  challenger:
    provider: "openai"  # Options: "openai", "anthropic", "ollama", "docker"
    config:
      base_url: "https://api.openai.com/v1"  # Use external API
      model_name: "gpt-4o"  # Can be gpt-4o, gpt-4-turbo, claude-3-opus, etc.
      api_key: "${OPENAI_API_KEY}"  # Will be replaced by environment variable
      max_tokens: 4096
      temperature: 0.7
  
  # Alternative challenger configurations (uncomment to use)
  # challenger_claude:
  #   provider: "anthropic"
  #   config:
  #     base_url: "https://api.anthropic.com"
  #     model_name: "claude-3-opus-20240229"
  #     api_key: "${ANTHROPIC_API_KEY}"
  #     max_tokens: 4096
  
  # challenger_local:
  #   provider: "openai"
  #   config:
  #     base_url: "http://localhost:12434/engines/llama.cpp/v1"
  #     model_name: "ai/llama3.2"
  
  solver:
    provider: "openai"
    config:
      base_url: "http://localhost:12434/engines/llama.cpp/v1"  
      model_name: "ai/llama3.2"

# Timeout settings (in seconds)
timeouts:
  evaluation: 30
  generation: 60
  
# Retry settings
retry:
  max_attempts: 3
  backoff_factor: 2.0

# LangSmith Integration for Experiment Tracking
langsmith:
  api_key: "${LANGSMITH_API_KEY}"  # Will be replaced by environment variable
  project: "rzero-training"
  endpoint: "https://api.smith.langchain.com"
  enabled: true